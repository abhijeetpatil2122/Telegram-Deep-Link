name: Crawl deep links

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: deep-link-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Crawl official Telegram deep-link documentation only
        run: npm run crawl
      - name: Publish official documentation as Rich Messages to admin private chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '1314643983'
          PUBLISH_FULL_INVENTORY: 'true'
        run: npm run publish
      - name: Send Rich Message crawl report to admin private chat
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '1314643983'
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm run notify
      - name: Commit updated documentation catalog and notification state
        run: |
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "No inventory or notification-state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh official deep-link documentation and notification state"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} raced with another update; retrying."
            else
              echo "Generated data conflicted with newer main; regenerating."
              git rebase --abort || true
              git reset --hard origin/main
              npm run check
              npm run crawl
              git add data/
              if git diff --cached --quiet -- data/; then
                echo "Latest main already contains current generated data."
                exit 0
              fi
              git commit -m "chore: refresh deep-link inventory and notification state"
            fi
          done
          echo "Unable to push generated data after 3 attempts."
          exit 1
