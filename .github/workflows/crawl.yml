name: Crawl deep links

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: deep-link-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Crawl official docs and Android source
        run: npm run crawl
      - name: Commit updated inventory
        run: |
          git add data/
          if git diff --cached --quiet -- data/; then
            echo "No inventory changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh deep-link inventory"
          # A user commit may land while the crawl is running. Rebase if safe;
          # if generated data conflicts, reset to latest main and regenerate it.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} raced with another update; retrying."
            else
              echo "Inventory conflicted with newer main; regenerating from latest main."
              git rebase --abort || true
              git reset --hard origin/main
              npm run check
              npm run crawl
              git add data/
              if git diff --cached --quiet -- data/; then
                echo "Latest main already contains the current inventory."
                exit 0
              fi
              git commit -m "chore: refresh deep-link inventory"
            fi
          done
          echo "Unable to push inventory after 3 attempts."
          exit 1
